<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DWP301c Codex — Knowledge & Study Workbench</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e5bb8'/%3E%3Cpath d='M9 23V9a3 3 0 0 1 3-3h11v20H12a3 3 0 0 1 0-6h11' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/styles.css?v=20261125e" />
</head>
<body>
  <!-- Scroll reading progress bar -->
  <div class="read-progress-track" aria-hidden="true">
    <div id="readProgressBar" class="read-progress-bar"></div>
  </div>

  <!-- Top Navigation Header -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="mobileMenuBtn" class="icon-btn mobile-only" aria-label="Toggle syllabus navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>

      <a href="#overview" id="brandLink" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
            <path d="M8 7h8" />
            <path d="M8 11h6" />
          </svg>
        </span>
        <span class="brand-title">DWP301c Codex</span>
      </a>

      <div class="topbar-divider" aria-hidden="true"></div>

      <!-- Course Switcher -->
      <div class="course-switcher-wrap">
        <button id="courseSwitcherBtn" class="course-switcher-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="activeCourseLabel" class="course-switcher-label">Loading course...</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
      </div>
    </div>

    <nav class="topbar-modes" aria-label="Workspace modes">
      <button class="mode-tab is-active" data-mode="overview">Overview</button>
      <button class="mode-tab" data-mode="guides">Study Guides</button>
      <button class="mode-tab" data-mode="reader">Source Archive</button>
      <button class="mode-tab" data-mode="cheatsheets">Cheat Sheets</button>
      <button class="mode-tab" data-mode="quizzes">Practice Quiz</button>
    </nav>

    <div class="topbar-right">
      <button id="searchTriggerBtn" class="search-trigger" aria-label="Search course knowledge">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="20" y1="20" x2="16.65" y2="16.65" />
        </svg>
        <span class="search-trigger-text">Search notes...</span>
        <kbd class="kbd-hint">Ctrl K</kbd>
      </button>

      <div id="headerProgressPill" class="progress-pill" title="Completed lessons in active course">
        <span id="headerProgressText" class="tabular">0/0</span>
      </div>

      <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle color theme" title="Switch light / dark theme">
        <svg id="themeIconSun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg id="themeIconMoon" class="hidden" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Course Switcher Popover (rendered at body level to avoid clipping) -->
  <div id="courseMenuPopover" class="course-popover hidden" role="listbox" aria-label="Select DWP301c course"></div>

  <!-- Mobile backdrop -->
  <div id="sidebarBackdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>

  <!-- Main Workspace Shell -->
  <div class="workspace-shell">
    <!-- Left Syllabus Rail -->
    <aside id="syllabusRail" class="syllabus-rail" aria-label="Course syllabus">
      <div class="rail-header">
        <div class="rail-filter-group" role="tablist" aria-label="Filter lessons">
          <button class="filter-chip is-active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="video">Videos</button>
          <button class="filter-chip" data-filter="reading">Readings</button>
          <button class="filter-chip" data-filter="cheat_sheet">Sheets</button>
          <button class="filter-chip" data-filter="bookmarked">Saved</button>
        </div>
      </div>

      <div id="syllabusTree" class="syllabus-tree">
        <div class="skeleton-stack">
          <div class="skeleton-line w-75"></div>
          <div class="skeleton-line w-100"></div>
          <div class="skeleton-line w-85"></div>
          <div class="skeleton-line w-65"></div>
        </div>
      </div>
    </aside>

    <!-- Primary Content Stage -->
    <main id="mainStage" class="main-stage" tabindex="-1">
      <div id="stageContainer" class="stage-container">
        <!-- Dynamically rendered: Overview / Reader / Cheat Sheets / Quiz -->
      </div>
    </main>

    <!-- Right On-Page TOC Rail (Visible in Reader mode on desktop) -->
    <aside id="tocRail" class="toc-rail hidden" aria-label="On this page">
      <div class="toc-sticky">
        <p class="toc-heading">On this page</p>
        <ul id="tocList" class="toc-list"></ul>
      </div>
    </aside>
  </div>

  <!-- Native Dialog Command Palette (Ctrl+K) -->
  <dialog id="searchDialog" class="search-dialog" aria-label="Full-text search">
    <div class="search-dialog-inner">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="20" y1="20" x2="16.65" y2="16.65" />
        </svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Search Cloud, HTML/CSS/JS, Git, React, Node.js, Python, Flask, Django, Docker, K8s..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="searchCloseBtn" class="kbd-hint kbd-close" type="button">Esc</button>
      </div>
      <div id="searchResults" class="search-results">
        <div class="search-empty">
          Type any keyword (e.g. <code>Kubernetes</code>, <code>Express</code>, <code>Pandas</code>, <code>ORM</code>, <code>useState</code>) to search all 12 courses via SQLite FTS5.
        </div>
      </div>
      <div class="search-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span><kbd>Enter</kbd> Open lesson</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </dialog>

  <!-- Toast feedback -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/static/app.js?v=20261125d" type="module"></script>
</body>
</html>
